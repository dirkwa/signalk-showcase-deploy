name: Show the showcase logs

# Prints the app's recent log lines and machine state, for when the demo
# stops answering and nobody is at a desktop to open the Fly dashboard.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLY_APP: signalk-showcase

jobs:
  logs:
    if: github.repository == 'dirkwa/signalk-showcase-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Machine state
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$FLY_APP"
          flyctl machines list --app "$FLY_APP"
          flyctl volumes list --app "$FLY_APP"
      - name: Recent log lines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs --app "$FLY_APP" --no-tail
