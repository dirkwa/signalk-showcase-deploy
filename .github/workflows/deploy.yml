name: Build the demo.signalk.org image folder

# Builds fly_io/demo_signalk_org from dirkwa/signalk-server's
# dirk-demo-deploy branch (charts, tidal data, demo plugins) and uploads it
# as an artifact, which is then deployed to demo.signalk.org with flyctl.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dirkwa-demo
  cancel-in-progress: false
  queue: max

env:
  # The chart conversion installs the server from npm, so it takes a
  # released version.
  SK_VERSION: v2.37.0

jobs:
  build:
    if: github.repository == 'dirkwa/signalk-showcase-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dirkwa/signalk-server
          ref: dirk-demo-deploy
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the demo plugin, charts and tidal data
        working-directory: ./fly_io/demo_signalk_org
        run: node build-assets.ts "$SK_VERSION"
      - name: Upload the image folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo_signalk_org
          path: fly_io/demo_signalk_org
          include-hidden-files: true
